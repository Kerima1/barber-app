<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Admin — Kerima Apps</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Tajawal:wght@400;500;700;900&display=swap');

  :root {
    --bg: #F3EEFB; --surface: #FFFFFF; --surface-2: #ECE4FB; --border: #D9CCF2;
    --text: #1E1033; --dim: #7A6B96; --accent: #7C5CFF; --danger: #C94C73; --good: #16A34A; --amber: #D97706;
  }
  html[data-theme="dark"] {
    --bg: #1E1033; --surface: #2A1B45; --surface-2: #34204F; --border: #4A3370;
    --text: #F4F1FA; --dim: #B6A8D1; --accent: #9C7CFF; --danger: #C94C73; --good: #4ADE80; --amber: #FBBF24;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  input { -webkit-user-select: text; user-select: text; -webkit-appearance: none; appearance: none; }

  body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding: 20px 16px 50px; transition: background .25s, color .25s; }
  body.ar { font-family: 'Tajawal', sans-serif; }
  button { cursor: pointer; font-family: inherit; border: none; background: none; }

  .topbar { max-width: 760px; margin: 0 auto 18px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .brand { font-family: 'Space Grotesk', sans-serif; font-size: 19px; font-weight: 700; }
  .controls { display: flex; gap: 6px; }
  .pill-toggle { display: flex; background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 3px; gap: 3px; }
  .pill-toggle button { color: var(--dim); font-weight: 600; font-size: 11px; padding: 6px 11px; border-radius: 16px; }
  .pill-toggle button.active { background: var(--accent); color: #fff; }
  .theme-btn { width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--border); background: var(--surface); color: var(--text); display: flex; align-items: center; justify-content: center; }

  .wrap { max-width: 760px; margin: 0 auto; }

  .tabs { display: flex; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 4px; gap: 4px; margin-bottom: 18px; }
  .tabs button { flex: 1; padding: 11px; border-radius: 10px; color: var(--dim); font-weight: 700; font-size: 13px; }
  .tabs button.active { background: var(--accent); color: #fff; }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 16px; margin-bottom: 14px; }
  .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 14px; }
  .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 14px; text-align: center; }
  .stat-card .num { font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 700; }
  .stat-card .lbl { font-size: 10.5px; color: var(--dim); margin-top: 2px; }

  .search-row { display: flex; gap: 8px; margin-bottom: 14px; }
  .search-row input { flex: 1; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font-size: 14px; font-family: inherit; }
  .search-row input:focus { outline: none; border-color: var(--accent); }
  .icon-btn { width: 44px; flex-shrink: 0; border-radius: 12px; border: 1px solid var(--border); background: var(--surface); font-size: 16px; }

  .account-row { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 13px 14px; margin-bottom: 8px; display: flex; align-items: center; gap: 10px; }
  .account-row.selectable { cursor: pointer; }
  .ar-checkbox { width: 20px; height: 20px; border-radius: 6px; border: 1.5px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; flex-shrink: 0; }
  .ar-checkbox.checked { background: var(--accent); border-color: var(--accent); color: #fff; }
  .ar-main { flex: 1; min-width: 0; }
  .ar-name { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 14.5px; }
  .ar-meta { font-size: 11.5px; color: var(--dim); margin-top: 1px; }
  .ar-pay-line { font-size: 11.5px; font-weight: 700; margin-top: 3px; }
  .ar-pay-line.paid { color: var(--good); }
  .ar-pay-line.unpaid { color: var(--danger); }

  .status-pill { padding: 4px 10px; border-radius: 20px; font-size: 10.5px; font-weight: 700; flex-shrink: 0; }
  .status-pill.active { background: rgba(22,163,74,.12); color: var(--good); }
  .status-pill.pending { background: rgba(217,119,6,.12); color: var(--amber); }

  .ar-actions { display: flex; gap: 6px; flex-shrink: 0; }
  .ar-actions button { width: 34px; height: 34px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface-2); font-size: 14px; }
  .ar-pay-btn { padding: 9px 14px; border-radius: 10px; font-size: 11.5px; font-weight: 700; flex-shrink: 0; }
  .ar-pay-btn.is-unpaid { background: var(--accent); color: #fff; }
  .ar-pay-btn.is-paid { background: var(--surface-2); color: var(--good); border: 1px solid var(--good); }

  .month-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
  .month-nav button { width: 32px; height: 32px; border-radius: 10px; background: var(--surface-2); font-size: 16px; }
  .month-nav .m-label { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 14px; }

  .price-row { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; }
  .price-row .p-value { font-family: 'Space Grotesk', sans-serif; font-size: 20px; font-weight: 700; }
  .price-row .p-value span { font-size: 11px; color: var(--dim); font-weight: 600; }
  .edit-price-btn { font-size: 11.5px; font-weight: 700; color: var(--accent); border: 1px solid var(--accent); border-radius: 10px; padding: 7px 12px; }

  .progress-bar { height: 8px; border-radius: 6px; background: var(--surface-2); overflow: hidden; margin: 10px 0 6px; }
  .progress-fill { height: 100%; background: var(--good); border-radius: 6px; transition: width .3s; }
  .progress-caption { font-size: 11px; color: var(--dim); text-align: center; }

  .bulk-row { display: flex; gap: 8px; margin-bottom: 10px; }
  .bulk-row button { flex: 1; padding: 10px; border-radius: 10px; font-size: 12px; font-weight: 700; border: 1px solid var(--border); background: var(--surface-2); }
  .bulk-row button.enabled { background: var(--accent); color: #fff; border-color: var(--accent); }

  label { display: block; font-size: 12px; font-weight: 600; color: var(--dim); margin: 10px 0 5px; }
  input[type=text] { width: 100%; padding: 12px 13px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface-2); color: var(--text); font-size: 14px; font-family: inherit; }
  select { width: 100%; padding: 12px 13px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface-2); color: var(--text); font-size: 14px; font-family: inherit; }
  .btn-primary { width: 100%; padding: 13px; background: var(--accent); color: #fff; border-radius: 12px; font-weight: 700; font-size: 14px; margin-top: 14px; }
  .saved-msg { text-align: center; color: var(--good); font-size: 12.5px; font-weight: 700; margin-top: 10px; }

  .eyebrow { color: var(--dim); font-size: 11px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 10px; }
  .note { text-align: center; color: var(--dim); opacity: .6; font-size: 11px; margin-top: 24px; line-height: 1.6; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.55); align-items: center; justify-content: center; padding: 20px; z-index: 80; }
  .modal-overlay.show { display: flex; }
  .modal-card { background: var(--surface); border: 1px solid var(--border); border-radius: 18px; padding: 24px; max-width: 320px; width: 100%; text-align: center; }
  .modal-card .msg { color: var(--dim); font-size: 13.5px; margin-bottom: 20px; }
  .modal-actions { display: flex; gap: 10px; }
  .modal-actions button { flex: 1; padding: 12px; border-radius: 10px; font-weight: 700; font-size: 13px; }
  .modal-btn-ghost { background: var(--surface-2); color: var(--text); }
  .modal-btn-confirm { background: var(--accent); color: #fff; }

  .login-avatar { width: 70px; height: 70px; margin: 0 auto 16px; display: block; border-radius: 20px; box-shadow: 0 14px 30px rgba(124,92,255,.3); }
  .login-head { text-align: center; margin-bottom: 22px; }
  .login-head h1 { font-size: 22px; font-weight: 800; font-family: 'Space Grotesk', sans-serif; }
  .login-head p { color: var(--dim); font-size: 13px; margin-top: 4px; }
  .error { color: var(--danger); font-size: 13px; margin: 10px 0; display: none; text-align: left; }
  #loading, #unauthorized { text-align: center; padding: 80px 20px; color: var(--dim); }
  .hidden { display: none !important; }
</style>
</head>
<body>

<div id="loading">Chargement…</div>

<!-- LOGIN (no sign-up — the admin account is created once by hand) -->
<div id="auth-view" class="hidden wrap" style="padding-top:40px;">
  <div class="login-head">
    <h1 data-fr="Connexion administrateur" data-ar="تسجيل دخول المسؤول">Connexion administrateur</h1>
    <p data-fr="Accès réservé" data-ar="وصول مقيّد">Accès réservé</p>
  </div>
  <div class="card">
    <label data-fr="E-mail" data-ar="البريد الإلكتروني">E-mail</label>
    <input type="text" id="f-email" placeholder="vous@exemple.com">
    <label data-fr="Mot de passe" data-ar="كلمة المرور">Mot de passe</label>
    <input type="text" id="f-pass" placeholder="••••••••" style="-webkit-text-security:disc;">
    <div class="error" id="auth-error"></div>
    <button class="btn-primary" onclick="doLogin()" data-fr="Entrer" data-ar="دخول">Entrer</button>
  </div>
</div>

<!-- NOT THE ADMIN -->
<div id="unauthorized" class="hidden">
  <p data-fr="Ce compte n'est pas autorisé à accéder à cette page." data-ar="هذا الحساب غير مصرح له بالوصول إلى هذه الصفحة.">Ce compte n'est pas autorisé à accéder à cette page.</p>
  <button class="btn-primary" style="max-width:200px; margin:16px auto 0;" onclick="doSignOut()" data-fr="Se déconnecter" data-ar="تسجيل الخروج">Se déconnecter</button>
</div>

<!-- MAIN ADMIN UI -->
<div id="admin-view" class="hidden">

<div class="topbar">
  <div class="brand">Admin — Kerima Apps</div>
  <div class="controls">
    <div class="pill-toggle">
      <button class="active" id="lang-fr" onclick="setLang('fr')">FR</button>
      <button id="lang-ar" onclick="setLang('ar')">عربي</button>
    </div>
    <button class="theme-btn" id="theme-btn" onclick="toggleTheme()"></button>
    <button class="icon-btn" onclick="doSignOut()" title="Déconnexion" style="width:36px;">⏻</button>
  </div>
</div>

<div class="wrap">

  <div class="tabs">
    <button class="active" onclick="setTab('accounts')" id="tab-accounts-btn" data-fr="Salons" data-ar="الصالونات">Salons</button>
    <button onclick="setTab('payments')" id="tab-payments-btn" data-fr="Paiements" data-ar="المدفوعات">Paiements</button>
    <button onclick="setTab('settings')" id="tab-settings-btn" data-fr="Réglages" data-ar="الإعدادات">Réglages</button>
  </div>

  <!-- ACCOUNTS TAB -->
  <div id="tab-accounts">
    <div class="stat-grid">
      <div class="stat-card"><div class="num" id="stat-all">—</div><div class="lbl" data-fr="Total" data-ar="الإجمالي">Total</div></div>
      <div class="stat-card"><div class="num" id="stat-active" style="color:var(--good);">—</div><div class="lbl" data-fr="Actifs" data-ar="نشط">Actifs</div></div>
      <div class="stat-card"><div class="num" id="stat-pending" style="color:var(--amber);">—</div><div class="lbl" data-fr="En attente" data-ar="قيد الانتظار">En attente</div></div>
    </div>
    <div class="search-row">
      <input type="text" id="acc-search" placeholder="Rechercher un salon…" oninput="renderAccounts()">
    </div>
    <div id="accounts-list"></div>
  </div>

  <!-- PAYMENTS TAB -->
  <div id="tab-payments" style="display:none;">
    <div class="card">
      <div class="eyebrow" style="margin-bottom:0;" data-fr="Prix mensuel / salon" data-ar="السعر الشهري / صالون">Prix mensuel / salon</div>
      <div class="price-row">
        <div class="p-value"><span id="price-val">1500</span> <span data-fr="MRU/mois" data-ar="أوقية/شهر">MRU/mois</span></div>
        <button class="edit-price-btn" onclick="editPrice()" data-fr="✎ Modifier" data-ar="✎ تعديل">✎ Modifier</button>
      </div>
      <div class="month-nav" style="margin-top:16px;">
        <button onclick="changeMonth(-1)">‹</button>
        <div class="m-label" id="month-label">—</div>
        <button onclick="changeMonth(1)">›</button>
      </div>
    </div>

    <div class="card">
      <div style="display:flex; justify-content:space-between; font-size:12.5px; font-weight:700;">
        <span style="color:var(--good);" id="paid-count">0 <span data-fr="payés" data-ar="مدفوع">payés</span></span>
        <span style="color:var(--danger);" id="unpaid-count">0 <span data-fr="impayés" data-ar="غير مدفوع">impayés</span></span>
      </div>
      <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%;"></div></div>
      <div class="progress-caption" id="progress-caption">0% collecté</div>
    </div>

    <div class="search-row">
      <input type="text" id="pay-search" placeholder="Rechercher…" oninput="renderPayments()">
      <button class="icon-btn" id="select-toggle-btn" onclick="toggleSelecting()">☑️</button>
    </div>
    <div class="bulk-row" style="margin-bottom:10px;">
      <button id="unpaid-filter-btn" onclick="toggleUnpaidFilter()" data-fr="Afficher seulement les impayés" data-ar="عرض غير المدفوعين فقط">Afficher seulement les impayés</button>
    </div>
    <div class="bulk-row" id="bulk-row" style="display:none;">
      <button onclick="selectAllUnpaid()" data-fr="Tout sélectionner" data-ar="تحديد الكل">Tout sélectionner</button>
      <button id="bulk-mark-btn" onclick="confirmBulkPaid()" data-fr="✓ Marquer payé" data-ar="✓ وضع كمدفوع">✓ Marquer payé</button>
    </div>
    <div id="payments-list"></div>
  </div>

  <!-- SETTINGS TAB -->
  <div id="tab-settings" style="display:none;">
    <div class="card">
      <div class="eyebrow" data-fr="Numéro WhatsApp de contact" data-ar="رقم واتساب للتواصل">Numéro WhatsApp de contact</div>
      <label data-fr="Affiché aux propriétaires en cas de besoin" data-ar="يظهر لأصحاب الصالونات عند الحاجة">Affiché aux propriétaires en cas de besoin</label>
      <input type="text" id="wa-input" placeholder="+222 XX XX XX XX" value="+222 00 00 00 00">
      <button class="btn-primary" onclick="saveWhatsapp()" data-fr="Enregistrer" data-ar="حفظ">Enregistrer</button>
      <div class="saved-msg" id="wa-saved" style="display:none;" data-fr="✓ Enregistré" data-ar="✓ تم الحفظ">✓ Enregistré</div>
    </div>
    <div class="card">
      <div class="eyebrow" data-fr="Verrouillage automatique" data-ar="القفل التلقائي">Verrouillage automatique</div>
      <label data-fr="Désactiver automatiquement un salon non payé après le jour choisi du mois" data-ar="تعطيل الصالون تلقائيًا إذا لم يدفع بعد اليوم المحدد من الشهر">Désactiver automatiquement un salon non payé après le jour choisi du mois</label>
      <select id="lock-day-select" onchange="saveLockDay()">
        <option value="">Désactivé</option>
        <option value="5">Jour 5</option>
        <option value="10">Jour 10</option>
        <option value="15">Jour 15</option>
        <option value="20">Jour 20</option>
      </select>
    </div>
  </div>

</div>

<!-- confirm modal -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal-card">
    <div class="msg" id="modal-msg"></div>
    <div class="modal-actions">
      <button class="modal-btn-ghost" onclick="closeModal()" data-fr="Annuler" data-ar="إلغاء">Annuler</button>
      <button class="modal-btn-confirm" id="modal-confirm-btn" data-fr="Confirmer" data-ar="تأكيد">Confirmer</button>
    </div>
  </div>
</div>

</div><!-- /#admin-view -->

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
  getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut, sendPasswordResetEmail
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import {
  getFirestore, doc, getDoc, setDoc, updateDoc, onSnapshot, collection
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyA9JdUkigDQaxiAqfMX1k0D32iEOqSL5xs",
  authDomain: "barber-app-90f5d.firebaseapp.com",
  projectId: "barber-app-90f5d",
  storageBucket: "barber-app-90f5d.firebasestorage.app",
  messagingSenderId: "638654190129",
  appId: "1:638654190129:web:2bc706db7090fa8087bb10"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let currentLang = 'fr';
function t(fr, ar) { return currentLang === 'ar' ? ar : fr; }

const MOON_ICON = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>';
const SUN_ICON = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
function setThemeIcon(theme) { document.getElementById('theme-btn').innerHTML = theme === 'dark' ? MOON_ICON : SUN_ICON; }
window.toggleTheme = function () {
  const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  setThemeIcon(next);
};
(function () {
  const hour = new Date().getHours();
  const theme = (hour >= 19 || hour < 6) ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', theme);
  setThemeIcon(theme);
})();

window.setLang = function (lang) {
  currentLang = lang;
  document.body.className = lang === 'ar' ? 'ar' : '';
  document.documentElement.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
  document.getElementById('lang-fr').classList.toggle('active', lang === 'fr');
  document.getElementById('lang-ar').classList.toggle('active', lang === 'ar');
  document.querySelectorAll('[data-fr]').forEach(el => { el.textContent = lang === 'ar' ? el.getAttribute('data-ar') : el.getAttribute('data-fr'); });
  renderAccounts(); renderPayments(); renderMonthLabel();
};

window.setTab = function (tabName) {
  ['accounts', 'payments', 'settings'].forEach(name => {
    document.getElementById('tab-' + name).style.display = name === tabName ? 'block' : 'none';
    document.getElementById('tab-' + name + '-btn').classList.toggle('active', name === tabName);
  });
};

// ---------- real data (filled in by Firestore listeners below) ----------
let shops = [];          // each: { id (=uid), name, phone, email, active, createdAt, nextTicket }
let monthlyPrice = 1500;
let autoLockDay = '';
let payMonth = new Date().getMonth();
let payYear = new Date().getFullYear();
let payments = {};       // { "2026-9": { uid: true } } — loaded per month as you navigate
let selecting = false;
let selected = new Set();
let currentUid = null;
let showOnlyUnpaid = false;

window.toggleUnpaidFilter = function () {
  showOnlyUnpaid = !showOnlyUnpaid;
  document.getElementById('unpaid-filter-btn').classList.toggle('enabled', showOnlyUnpaid);
  renderPayments();
};

// ---------- auth ----------
window.doLogin = async function () {
  const email = document.getElementById('f-email').value.trim();
  const pass = document.getElementById('f-pass').value.trim();
  const errEl = document.getElementById('auth-error');
  errEl.style.display = 'none';
  if (!email || !pass) {
    errEl.textContent = t('Entre ton e-mail et ton mot de passe.', 'أدخل بريدك الإلكتروني وكلمة المرور.');
    errEl.style.display = 'block';
    return;
  }
  try {
    await signInWithEmailAndPassword(auth, email, pass);
  } catch (e) {
    errEl.textContent = t('E-mail ou mot de passe incorrect.', 'البريد الإلكتروني أو كلمة المرور غير صحيحة.');
    errEl.style.display = 'block';
  }
};
window.doSignOut = () => signOut(auth);

let paymentsUnsub = null, settingsUnsub = null, shopsUnsub = null;

onAuthStateChanged(auth, async (user) => {
  document.getElementById('loading').classList.add('hidden');
  if (!user) {
    currentUid = null;
    [paymentsUnsub, settingsUnsub, shopsUnsub].forEach(u => u && u());
    document.getElementById('admin-view').classList.add('hidden');
    document.getElementById('unauthorized').classList.add('hidden');
    document.getElementById('auth-view').classList.remove('hidden');
    return;
  }
  // confirmed signed in — now check this is actually the admin, by email,
  // not by a separate Firestore document (simpler: nothing to set up by
  // hand in the Firestore console beyond creating this one login).
  const ADMIN_EMAIL = 'fatimetousidiboba@gmail.com';
  if ((user.email || '').toLowerCase() !== ADMIN_EMAIL) {
    document.getElementById('auth-view').classList.add('hidden');
    document.getElementById('admin-view').classList.add('hidden');
    document.getElementById('unauthorized').classList.remove('hidden');
    return;
  }
  currentUid = user.uid;
  document.getElementById('auth-view').classList.add('hidden');
  document.getElementById('unauthorized').classList.add('hidden');
  document.getElementById('admin-view').classList.remove('hidden');
  startListeners();
});

function startListeners() {
  shopsUnsub = onSnapshot(collection(db, 'shops'), (snap) => {
    shops = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    renderAccounts();
    renderPayments();
  });

  settingsUnsub = onSnapshot(doc(db, 'settings', 'billing'), (snap) => {
    const d = snap.data() || {};
    monthlyPrice = d.monthlyPrice || 1500;
    autoLockDay = d.autoLockDay || '';
    document.getElementById('price-val').textContent = monthlyPrice;
    document.getElementById('lock-day-select').value = autoLockDay;
    renderPayments();
  });
  getDoc(doc(db, 'settings', 'contact')).then(snap => {
    document.getElementById('wa-input').value = (snap.data() || {}).whatsapp || '';
  });

  watchMonth();
}

function watchMonth() {
  if (paymentsUnsub) paymentsUnsub();
  paymentsUnsub = onSnapshot(doc(db, 'payments', monthKey()), (snap) => {
    payments[monthKey()] = snap.data() || {};
    renderPayments();
  });
}

const MONTHS_FR = ['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
const MONTHS_AR = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];

// ---------- accounts tab ----------
function renderAccounts() {
  document.getElementById('stat-all').textContent = shops.length;
  document.getElementById('stat-active').textContent = shops.filter(s => s.active).length;
  document.getElementById('stat-pending').textContent = shops.filter(s => !s.active).length;

  const q = document.getElementById('acc-search').value.trim().toLowerCase();
  const filtered = shops.filter(s => !q || s.name.toLowerCase().includes(q) || s.phone.includes(q));

  document.getElementById('accounts-list').innerHTML = filtered.map(s => `
    <div class="account-row">
      <div class="ar-main">
        <div class="ar-name">${s.name}</div>
        <div class="ar-meta">${s.phone}</div>
      </div>
      <div style="display:flex; flex-direction:column; gap:4px; align-items:flex-end;">
        <span class="status-pill ${s.active ? 'active' : 'pending'}">${s.active ? t('Actif','نشط') : t('En attente','قيد الانتظار')}</span>
        <span class="status-pill ${(s.nextTicket || 1) > 1 ? 'active' : 'pending'}">${(s.nextTicket || 1) > 1 ? t('Utilisé','مستخدم') : t('Non utilisé','غير مستخدم')}</span>
      </div>
      <div class="ar-actions">
        <button onclick="toggleActive('${s.id}')" title="${s.active ? t('Désactiver','تعطيل') : t('Activer','تفعيل')}">${s.active ? '🔒' : '✅'}</button>
        <button onclick="resetPin('${s.id}')" title="${t('Réinitialiser le code PIN','إعادة ضبط رمز PIN')}">🔑</button>
      </div>
    </div>`).join('') || `<div style="text-align:center; color:var(--dim); padding:30px 0; font-size:13px;">${t('Aucun résultat','لا توجد نتائج')}</div>`;
}
window.toggleActive = async function (id) {
  const s = shops.find(s => s.id === id);
  await updateDoc(doc(db, 'shops', id), { active: !s.active });
};
window.resetPin = async function (id) {
  const s = shops.find(s => s.id === id);
  try {
    await sendPasswordResetEmail(auth, s.email);
    alert(t('E-mail de réinitialisation envoyé à ' + s.email, 'تم إرسال بريد إعادة الضبط إلى ' + s.email));
  } catch (e) {
    alert(t('Échec de l\u2019envoi — vérifie l\u2019adresse e-mail du salon.', 'فشل الإرسال — تحقق من البريد الإلكتروني للصالون.'));
  }
};

// ---------- payments tab ----------
function monthKey() { return payYear + '-' + payMonth; }
function isPaid(id) { return !!(payments[monthKey()] && payments[monthKey()][id]); }

function renderMonthLabel() {
  const months = currentLang === 'ar' ? MONTHS_AR : MONTHS_FR;
  document.getElementById('month-label').textContent = months[payMonth] + ' ' + payYear;
}
window.changeMonth = function (delta) {
  payMonth += delta;
  if (payMonth < 0) { payMonth = 11; payYear--; }
  if (payMonth > 11) { payMonth = 0; payYear++; }
  renderMonthLabel();
  watchMonth();
};

window.editPrice = async function () {
  const v = prompt(t('Nouveau prix (MRU) :', 'السعر الجديد (أوقية):'), monthlyPrice);
  if (v && !isNaN(v)) {
    await setDoc(doc(db, 'settings', 'billing'), { monthlyPrice: Number(v), autoLockDay: autoLockDay || null }, { merge: true });
  }
};

window.toggleSelecting = function () {
  selecting = !selecting;
  selected = new Set();
  document.getElementById('select-toggle-btn').textContent = selecting ? '✕' : '☑️';
  document.getElementById('bulk-row').style.display = selecting ? 'flex' : 'none';
  renderPayments();
};
window.selectAllUnpaid = function () {
  selected = new Set(shops.filter(s => !isPaid(s.id)).map(s => s.id));
  renderPayments();
};
window.togglePaidForShop = async function (id) {
  const key = monthKey();
  const newVal = !isPaid(id);
  const update = {}; update[id] = newVal;
  await setDoc(doc(db, 'payments', key), update, { merge: true });
};
window.toggleSelectRow = function (id) {
  if (selected.has(id)) selected.delete(id); else selected.add(id);
  renderPayments();
};
window.confirmBulkPaid = function () {
  if (selected.size === 0) return;
  showModal(t('Marquer ' + selected.size + ' salon(s) comme payé(s) ?', 'وضع ' + selected.size + ' صالون كمدفوع؟'), async () => {
    const key = monthKey();
    const update = {};
    selected.forEach(id => { update[id] = true; });
    await setDoc(doc(db, 'payments', key), update, { merge: true });
    selecting = false; selected = new Set();
    document.getElementById('select-toggle-btn').textContent = '☑️';
    document.getElementById('bulk-row').style.display = 'none';
  });
};

function renderPayments() {
  const q = document.getElementById('pay-search').value.trim().toLowerCase();
  const filtered = shops.filter(s => {
    if (showOnlyUnpaid && isPaid(s.id)) return false;
    return !q || s.name.toLowerCase().includes(q) || s.phone.includes(q);
  });

  const paidCount = shops.filter(s => isPaid(s.id)).length;
  const unpaidCount = shops.length - paidCount;
  const pct = shops.length ? Math.round((paidCount / shops.length) * 100) : 0;
  document.getElementById('paid-count').innerHTML = paidCount + ' <span>' + t('payés','مدفوع') + '</span>';
  document.getElementById('unpaid-count').innerHTML = unpaidCount + ' <span>' + t('impayés','غير مدفوع') + '</span>';
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-caption').textContent = pct + '% ' + t('collecté','تم تحصيله');

  document.getElementById('bulk-mark-btn').className = selected.size > 0 ? 'enabled' : '';
  document.getElementById('bulk-mark-btn').textContent = '✓ ' + t('Marquer payé','وضع كمدفوع') + (selected.size > 0 ? ' (' + selected.size + ')' : '');

  document.getElementById('payments-list').innerHTML = filtered.map(s => {
    const paid = isPaid(s.id);
    const isSel = selected.has(s.id);
    const rowClickable = selecting && !paid;
    return `
    <div class="account-row ${rowClickable ? 'selectable' : ''}" ${rowClickable ? `onclick="toggleSelectRow('${s.id}')"` : ''}>
      ${selecting ? `<div class="ar-checkbox ${isSel ? 'checked' : ''}">${isSel ? '✓' : ''}</div>` : ''}
      <div class="ar-main">
        <div class="ar-name">${s.name}</div>
        <div class="ar-meta">${s.phone}</div>
        <div class="ar-pay-line ${paid ? 'paid' : 'unpaid'}">${paid ? '✓ ' + t('Payé','مدفوع') + ' - ' + monthlyPrice + ' MRU' : '* ' + monthlyPrice + ' MRU ' + t('dû','مستحق')}</div>
      </div>
      ${!selecting ? `<button class="ar-pay-btn ${paid ? 'is-paid' : 'is-unpaid'}" onclick="confirmSinglePaid('${s.id}')">${paid ? '✓ ' + t('Payé','مدفوع') : t('Recevoir','استلام')}</button>` : ''}
    </div>`;
  }).join('') || `<div style="text-align:center; color:var(--dim); padding:30px 0; font-size:13px;">${t('Aucun résultat','لا توجد نتائج')}</div>`;
}
window.confirmSinglePaid = function (id) {
  const s = shops.find(s => s.id === id);
  const paid = isPaid(id);
  showModal(
    paid ? t('Marquer comme impayé ?', 'وضع كغير مدفوع؟') : t('Confirmer la réception du paiement de ' + s.name + ' ?', 'تأكيد استلام دفعة ' + s.name + '؟'),
    () => togglePaidForShop(id)
  );
};

// ---------- settings tab ----------
window.saveWhatsapp = async function () {
  const wa = document.getElementById('wa-input').value.trim();
  await setDoc(doc(db, 'settings', 'contact'), { whatsapp: wa }, { merge: true });
  document.getElementById('wa-saved').style.display = 'block';
  setTimeout(() => { document.getElementById('wa-saved').style.display = 'none'; }, 2000);
};
window.saveLockDay = async function () {
  const val = document.getElementById('lock-day-select').value;
  autoLockDay = val;
  await setDoc(doc(db, 'settings', 'billing'), { monthlyPrice, autoLockDay: val ? Number(val) : null }, { merge: true });
};

// ---------- shared confirm modal ----------
let modalAction = null;
function showModal(msg, onConfirm) {
  document.getElementById('modal-msg').textContent = msg;
  modalAction = onConfirm;
  document.getElementById('modal-overlay').classList.add('show');
}
window.closeModal = function () {
  document.getElementById('modal-overlay').classList.remove('show');
  modalAction = null;
};
document.getElementById('modal-confirm-btn').onclick = function () {
  if (modalAction) modalAction();
  closeModal();
};

renderAccounts();
renderMonthLabel();
renderPayments();
</script>
</body>
</html>
